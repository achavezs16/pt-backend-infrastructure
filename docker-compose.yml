version: '3.8'

services:
  mysql-productos:
    image: mysql:8.0
    container_name: pymetrack-mysql-productos
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ms_productos
      MYSQL_USER: pymetrack
      MYSQL_PASSWORD: pymetrack123
    ports:
      - "3309:3306"
    volumes:
      - mysql_productos_data:/var/lib/mysql
    networks:
      - pymetrack-network
    restart: unless-stopped

  mysql-pedidos:
    image: mysql:8.0
    container_name: pymetrack-mysql-pedidos
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ms_pedidos
      MYSQL_USER: pymetrack
      MYSQL_PASSWORD: pymetrack123
    ports:
      - "3307:3306"
    volumes:
      - mysql_pedidos_data:/var/lib/mysql
    networks:
      - pymetrack-network
    restart: unless-stopped

  mysql-user:
    image: mysql:8.0
    container_name: pymetrack-mysql-user
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ms_user
      MYSQL_USER: pymetrack
      MYSQL_PASSWORD: pymetrack123
    ports:
      - "3313:3306"
    volumes:
      - mysql_user_data:/var/lib/mysql
    networks:
      - pymetrack-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: pymetrack-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    networks:
      - pymetrack-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pymetrack-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pymetrack-network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: pymetrack-phpmyadmin
    environment:
      PMA_HOSTS_CONFIGURABLE: servers
    ports:
      - "8080:80"
    volumes:
      - ./phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
    networks:
      - pymetrack-network
    depends_on:
      - mysql-productos
      - mysql-pedidos
      - mysql-user
    restart: unless-stopped

  ms-user:
    build: ../backend/ms-user
    container_name: ms-user
    ports:
      - "8085:8085"
    networks:
      - pymetrack-network
    depends_on:
      - mysql-user
    restart: unless-stopped

  ms-productos:
    build: ../backend/ms-productos
    container_name: ms-productos
    ports:
      - "8081:8081"
    networks:
      - pymetrack-network
    depends_on:
      - mysql-productos
      - rabbitmq
    restart: unless-stopped

  ms-pedidos:
    build: ../backend/ms-pedidos
    container_name: ms-pedidos
    ports:
      - "8082:8082"
    networks:
      - pymetrack-network
    depends_on:
      - mysql-pedidos
      - rabbitmq
    restart: unless-stopped

  ms-notificaciones:
    build: ../backend/ms-notificaciones
    container_name: ms-notificaciones
    environment:
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME} 
      SENDGRID_ENABLED: "true"   
    networks:
      - pymetrack-network
    depends_on:
      - rabbitmq
    restart: unless-stopped

  ms-bff:
    build: ../backend/ms-bff
    container_name: ms-bff
    ports:
      - "8084:8084"
    networks:
      - pymetrack-network
    depends_on:
      - ms-user
      - ms-productos
      - ms-pedidos
    restart: unless-stopped

  ms-gateway:
    build: ../backend/ms-gateway
    container_name: ms-gateway
    ports:
      - "8086:8086"
    networks:
      - pymetrack-network
    depends_on:
      - ms-bff
      - ms-user
      - ms-productos
      - ms-pedidos
    restart: unless-stopped

volumes:
  mysql_productos_data:
  mysql_pedidos_data:
  mysql_user_data:
  rabbitmq_data:
  redis_data:

networks:
  pymetrack-network:
    driver: bridge